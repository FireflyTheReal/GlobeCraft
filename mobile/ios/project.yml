# XcodeGen spec for the iPadOS app: `brew install xcodegen`, then `xcodegen` here makes
# GlobeCraft.xcodeproj (not kept in git). See README.md.
name: GlobeCraft
options:
  bundleIdPrefix: app.globecraft
  deploymentTarget:
    iOS: "17.0"
targets:
  GlobeCraft:
    type: application
    platform: iOS
    sources:
      - GlobeCraft
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: Security.framework
    preBuildScripts:
      - name: Build the Rust globe
        script: '"$PROJECT_DIR/build-rust-ios.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.globecraft.mobile
        PRODUCT_NAME: GlobeCraft
        MARKETING_VERSION: 0.4.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GlobeCraft
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: GlobeCraft/GlobeCraft-Bridging-Header.h
        # The build script writes the Rust library into rust/ (outside the sandbox).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: -lglobecraft_mobile
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/rust/ios
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/rust/ios-sim
        CODE_SIGN_STYLE: Automatic
        # Set your team in Xcode (Signing & Capabilities); a free Apple ID works for
        # installing on your own iPad (the app then runs for 7 days per install).
        DEVELOPMENT_TEAM: ""
