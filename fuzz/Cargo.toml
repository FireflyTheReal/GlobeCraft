# Fuzz targets for every decoder of data GlobeCraft does not control (roadmap 10.5).
# Its own workspace, so the nightly-only fuzzing dependencies stay out of the
# application's lock file. See README.md.
[package]
name = "globecraft-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
globecraft-assistant = { path = "../crates/globecraft-assistant" }
globecraft-core = { path = "../crates/globecraft-core" }
globecraft-data = { path = "../crates/globecraft-data", default-features = false, features = ["fuzzing"] }
libfuzzer-sys = "0.4"

[profile.release]
debug = 1
# Arithmetic overflow is a finding: the application's debug builds and tests panic on it.
overflow-checks = true
debug-assertions = true

[[bin]]
name = "assistant_reply"
path = "fuzz_targets/assistant_reply.rs"
test = false
doc = false
bench = false

