[package]
name = "globecraft-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["updater"]
profiling = []
# Exposes `globecraft_data::fuzzing`, the entry points of the fuzz targets in `fuzz/`.
fuzzing = []
# The self-updater (GitHub releases). Off for packages updated by a package manager.
updater = ["dep:self_update"]

[dependencies]
globecraft-core.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde_json.workspace = true
image.workspace = true
png.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
serde.workspace = true
glam.workspace = true
quick-xml.workspace = true
kml.workspace = true
zip.workspace = true
moka.workspace = true
rayon.workspace = true
rusqlite.workspace = true
tokio-rusqlite.workspace = true
fst.workspace = true
flate2.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
sgp4.workspace = true
self_update = { workspace = true, optional = true }
semver.workspace = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# Settings › Keys can keep the keys in the system keychain (off by default).
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
