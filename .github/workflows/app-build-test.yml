name: app-build-test

on:
  push:
    branches: ['**']
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'assets/**'
      - 'scripts/prepare_sky.py'
      - 'scripts/test_prepare_sky.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/app-build-test.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'assets/**'
      - 'scripts/prepare_sky.py'
      - 'scripts/test_prepare_sky.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/app-build-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-checks:
    name: Select application checks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.changes.outputs.release != 'true' }}
    steps:
      - name: Detect release workflow paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: changes
        with:
          # Keep these paths aligned with release.yml's pull_request trigger.
          filters: |
            release:
              - '.github/workflows/release.yml'
              - 'scripts/package_*.py'
              - 'scripts/test_package_*.py'
              - 'packaging/**'
              - 'assets/packaging/**'
              - 'cliff.toml'
              - 'docs/RELEASING.md'

  verify:
    needs: select-checks
    if: needs.select-checks.outputs.run == 'true'
    name: ubuntu-latest / Rust 1.97
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: a floating "stable" brought new clippy lints (1.99) that failed
      # builds which passed locally. Raise this together with the local toolchain.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-build-test-ubuntu-latest-1.97
      - name: Install Linux development libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: Verify bundled sky provenance
        run: python3 -m unittest discover -s scripts -p 'test_prepare_sky.py'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Check CPU-only desktop
        run: cargo clippy -p globecraft --all-targets --no-default-features --locked -- -D warnings
      - name: Build desktop application
        run: cargo build --workspace --locked
      - name: Lint profiling configuration
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  other-platforms:
    needs: select-checks
    if: needs.select-checks.outputs.run == 'true'
    # The same gate on macOS and Windows (roadmap 10.1): lints and tests, so a
    # platform-specific break shows on the push, not at release time.
    name: ${{ matrix.os }} / Rust 1.97
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-build-test-${{ matrix.os }}-1.97
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  ui-screenshots:
    needs: select-checks
    if: needs.select-checks.outputs.run == 'true'
    # The interface rendered offscreen on the CPU (Mesa lavapipe), as the manual
    # screenshot tests do on a desktop (roadmap 10.1). Every request to the network
    # goes to a dead proxy: the tests must not depend on public map services, and
    # what they check (the interface, panels, cards, symbols) needs none. The
    # pictures are uploaded for review.
    name: ubuntu-latest / UI screenshots (lavapipe)
    runs-on: ubuntu-latest
    env:
      GLOBECRAFT_SHOTS: ${{ github.workspace }}/ui-screenshots
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97'
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-build-test-ui-screenshots-1.97
      - name: Install Linux development libraries and lavapipe
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev mesa-vulkan-drivers
      - name: Build the tests
        run: cargo test -p globecraft --release --locked --no-run
      - name: Render the interface
        # Offline from here: the dead proxy catches the app's requests, and cargo
        # uses what the build step fetched.
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          CARGO_NET_OFFLINE: 'true'
        run: >-
          cargo test -p globecraft --release --locked --
          --ignored --exact --test-threads=1
          app::screenshots::interface_screenshots app::screenshots::timeline_screenshot
          app::screenshots::point_layer_screenshot app::screenshots::selected_flight_screenshot
          app::screenshots::legend_screenshot app::screenshots::add_data_screenshots
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: ui-screenshots
          if-no-files-found: warn

  release-toolchain:
    needs: select-checks
    if: needs.select-checks.outputs.run == 'true'
    # Release builds (release.yml, FreeBSD, Snap) use Rust 1.95: keep the release
    # configuration compiling with it, so a tag never meets a toolchain surprise.
    name: ubuntu-latest / Rust 1.95 (release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-build-test-release-1.95
      - name: Install Linux development libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: Check the release configuration
        run: cargo check -p globecraft --release --no-default-features --locked
