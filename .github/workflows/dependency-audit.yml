name: dependency-audit

# Checks Cargo.lock against the RustSec advisory database: weekly, when the lock file
# changes, and by hand. A new advisory for a dependency fails the run.
on:
  schedule:
    - cron: '17 5 * * 1'
  push:
    paths:
      - 'Cargo.lock'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97'
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock
        run: cargo audit
