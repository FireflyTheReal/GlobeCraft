name: Border tiles

# Builds the borders-and-names tile set GlobeCraft streams: the OpenMapTiles
# `boundary` and `place` layers and the ocean of the `water` layer to zoom 12, cut from OpenFreeMap's weekly
# planet (Planetiler, OpenMapTiles schema), as PMTiles a client reads tile by tile.
# A full OpenFreeMap tile carries every layer (100-500 KB); these keep only what the
# globe draws. Manual only; publishing replaces the border files in the one
# `map-data` pre-release (the app's updater ignores pre-releases). Data: (c) OpenStreetMap contributors (ODbL), (c) OpenMapTiles.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenFreeMap planet version, e.g. 20261025_080012_pt (empty: the newest)'
        required: false
        default: ''
      publish:
        description: 'Upload the files as a data pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: border-tiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TIPPECANOE_REF: '2.79.0'
      PMTILES_VERSION: '1.31.2'
    steps:
      # The planet file is bigger than either disk alone: join the root disk's free
      # space and the temporary disk into one volume.
      - name: Remove preinstalled tools this job does not use
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift \
            /usr/local/lib/node_modules /usr/local/share/chromium /opt/microsoft /opt/google \
            /usr/local/julia* /opt/az /usr/share/miniconda /usr/local/aws-cli || true
          df -h /

      - name: Make room
        uses: easimon/maximize-build-space@v10
        with:
          build-mount-path: /work
          root-reserve-mb: 3072
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Pick the planet version
        id: pick
        run: |
          sudo chown "$USER" /work
          df -h / /work
          curl -fsS https://btrfs.openfreemap.com/files.txt -o /work/files.txt
          grep 'areas/planet/' /work/files.txt | tail -n 12
          version='${{ inputs.version }}'
          if [ -z "$version" ]; then
            version=$(grep -oE 'areas/planet/[0-9]{8}_[0-9]{6}_pt/tiles\.mbtiles' /work/files.txt \
              | sort | tail -n 1 | cut -d/ -f3)
          fi
          test -n "$version"
          url="https://btrfs.openfreemap.com/areas/planet/$version/tiles.mbtiles"
          size=$(curl -fsSI "$url" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          free=$(df --output=avail -B1 /work | tail -n 1)
          echo "::notice::Planet $version: $((size / 1024 / 1024 / 1024)) GiB; free on /work: $((free / 1024 / 1024 / 1024)) GiB"
          if [ "$size" -gt "$((free - 3 * 1024 * 1024 * 1024))" ]; then
            echo "::error::The planet file does not fit on /work"
            exit 1
          fi

      - name: Build tippecanoe and fetch pmtiles
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev aria2 sqlite3 > /dev/null
          git clone -q --depth 1 --branch "$TIPPECANOE_REF" https://github.com/felt/tippecanoe /work/tippecanoe
          make -s -C /work/tippecanoe -j"$(nproc)" tile-join
          curl -fsSL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /work pmtiles

      - name: Download the planet
        run: |
          aria2c -q -x 8 -s 8 -k 64M --file-allocation=none -d /work -o planet.mbtiles '${{ steps.pick.outputs.url }}'
          ls -l /work/planet.mbtiles
          df -h /work

      # Zooms 13-14 are most of the planet: let tile-join see only zooms 0-12, by
      # narrowing the planet's own `tiles` view in place (copying the rest out needed
      # more room than the volume has left beside the planet).
      - name: Show only zooms 0-12
        working-directory: /work
        shell: python3 {0}
        run: |
          import re, sqlite3, sys, traceback
          def report(kind, exc_type, exc, tb):
              message = " | ".join(traceback.format_exception(exc_type, exc, tb)).replace("\n", " ")
              print(f"::error::{message[-900:]}")
          sys.excepthook = lambda *e: report("error", *e)
          db = sqlite3.connect("planet.mbtiles")
          kind, sql = db.execute("SELECT type, sql FROM sqlite_master WHERE name = 'tiles'").fetchone()
          print(f"::notice::Planet tiles {kind}: {' '.join(sql.split())[:300]}")
          if kind == "view":
              # The definition's own header, whatever whitespace follows its AS.
              body = re.match(r"(?is)\s*create\s+view\s+\S+\s+as\s+(.*)", sql).group(1)
              db.execute("DROP VIEW tiles")
              db.execute(f"CREATE VIEW tiles AS SELECT * FROM ({body}) WHERE zoom_level <= 12")
          else:
              db.execute("ALTER TABLE tiles RENAME TO tiles_all")
              db.execute("CREATE VIEW tiles AS SELECT * FROM tiles_all WHERE zoom_level <= 12")
          db.commit()
          count = db.execute("SELECT count(*) FROM tiles WHERE zoom_level = 4").fetchone()[0]
          print(f"::notice::Zoom 4 tiles through the narrowed view: {count}")

      - name: Keep borders, names and the ocean
        working-directory: /work
        # Temporary files (SQLite's index sort, tile-join, the converter) are as large
        # as the data: keep them off the small root disk.
        env:
          TMPDIR: /work/tmp
          SQLITE_TMPDIR: /work/tmp
        run: |
          mkdir -p "$TMPDIR"
          attribution='<a href="https://openmaptiles.org/">&copy; OpenMapTiles</a> <a href="https://www.openstreetmap.org/copyright">&copy; OpenStreetMap contributors</a>'
          ./tippecanoe/tile-join --force --no-tile-size-limit --maximum-zoom=12 \
            --layer=boundary --layer=place -A "$attribution" \
            -n "GlobeCraft borders and names" -o borders.mbtiles planet.mbtiles
          ./tippecanoe/tile-join --force --no-tile-size-limit --maximum-zoom=12 \
            --layer=water --feature-filter='{"water":["==","class","ocean"]}' -A "$attribution" \
            -n "GlobeCraft ocean" -o water.mbtiles planet.mbtiles
          rm planet.mbtiles

      - name: Measure
        working-directory: /work
        run: |
          for set in borders water; do
            echo "## $set"
            sqlite3 -header -column "$set.mbtiles" \
              "SELECT zoom_level AS z, count(*) AS tiles, round(sum(length(tile_data))/1048576.0, 1) AS MiB,
                      round(avg(length(tile_data))/1024.0, 2) AS avg_KiB, max(length(tile_data))/1024 AS max_KiB
               FROM tiles GROUP BY zoom_level ORDER BY zoom_level;"
          done | tee measure.txt
          ls -l *.mbtiles | tee -a measure.txt
          {
            echo '```'
            cat measure.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for set in borders water; do
            echo "::notice::$set by zoom (z tiles MiB): $(sqlite3 "$set.mbtiles" "SELECT group_concat(zoom_level || ' ' || n || ' ' || mib, ', ') FROM (SELECT zoom_level, count(*) AS n, round(sum(length(tile_data))/1048576.0) AS mib FROM tiles GROUP BY zoom_level ORDER BY zoom_level)")"
            echo "::notice::$set: $(sqlite3 "$set.mbtiles" "SELECT count(*) || ' tiles, ' || round(sum(length(tile_data))/1048576.0) || ' MiB, z12 avg ' || round(avg(CASE WHEN zoom_level = 12 THEN length(tile_data) END)/1024.0, 2) || ' KiB' FROM tiles")"
          done

      - name: Convert to PMTiles
        working-directory: /work
        # Temporary files (SQLite's index sort, tile-join, the converter) are as large
        # as the data: keep them off the small root disk.
        env:
          TMPDIR: /work/tmp
          SQLITE_TMPDIR: /work/tmp
        run: |
          mkdir -p "$TMPDIR"
          for set in borders water; do
            ./pmtiles convert "$set.mbtiles" "globecraft-$set-${{ steps.pick.outputs.version }}.pmtiles"
          done
          ls -l *.pmtiles | tee -a measure.txt
          for file in *.pmtiles; do
            echo "::notice::$file: $(( $(stat -c %s "$file") / 1048576 )) MiB"
          done

      - name: Split under GitHub's asset limit
        working-directory: /work
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          TMPDIR: /work/tmp
        # Release assets must stay under 2 GiB: an archive over the limit is cut into
        # parts, first by peeling off its top zoom, then into longitude halves. The app
        # tries a set's parts in order and skips those whose bounds miss a tile.
        shell: python3 {0}
        run: |
          import json, os, subprocess
          LIMIT = 1_900_000_000
          SOUTH, NORTH = -85.0511287798, 85.0511287798
          version = os.environ["VERSION"]
          sets = []
          for name in ["borders", "water"]:
              whole = f"globecraft-{name}-{version}.pmtiles"
              queue, parts = [(0, 12, -180.0, 180.0, whole)], []
              while queue:
                  low, high, west, east, path = queue.pop(0)
                  if os.path.getsize(path) < LIMIT:
                      parts.append(path)
                      continue
                  if low < high:
                      pieces = [(low, high - 1, west, east), (high, high, west, east)]
                  elif east - west > 1.0:
                      middle = (west + east) / 2
                      pieces = [(low, high, west, middle), (low, high, middle, east)]
                  else:
                      raise SystemExit(f"::error::{path} cannot be split further")
                  for low_z, high_z, w, e in pieces:
                      out = f"part-{name}-z{low_z}-{high_z}-{w:+.1f}-{e:+.1f}.pmtiles"
                      subprocess.run(["./pmtiles", "extract", whole, out,
                                      f"--minzoom={low_z}", f"--maxzoom={high_z}",
                                      f"--bbox={w},{SOUTH},{e},{NORTH}"], check=True)
                      queue.append((low_z, high_z, w, e, out))
                  if path != whole:
                      os.remove(path)
              # Final names: one part keeps the plain name, several are numbered.
              if parts != [whole]:
                  named = []
                  for index, path in enumerate(parts):
                      final = f"globecraft-{name}-{version}-{index}.pmtiles"
                      os.rename(path, final)
                      named.append(final)
                  os.remove(whole)
                  parts = named
              for path in parts:
                  print(f"::notice::{path}: {os.path.getsize(path) // 1048576} MiB")
              sets.append(parts)
          with open("parts.json", "w") as out:
              json.dump(sets, out)
          print(json.dumps(sets))

      - name: Publish into the map data release
        if: inputs.publish
        working-directory: /work
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
        # All map data lives in ONE pre-release, `map-data` (the app's updater
        # ignores pre-releases): its `manifest.json` names the current files of each
        # set. A new build uploads its files under new names, then switches the
        # manifest, then deletes the files of older builds except the one before
        # (a running app may still read it until it reloads the manifest).
        run: |
          set -euo pipefail
          for file in globecraft-*-"$VERSION"*.pmtiles; do
            size=$(stat -c %s "$file")
            if [ "$size" -ge 2147483648 ]; then
              echo "::error::$file is $size bytes, over GitHub's 2 GiB asset limit"
              exit 1
            fi
          done
          release=map-data
          if ! gh release view "$release" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$release" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Map data" \
              --notes "Map data GlobeCraft streams: manifest.json names the current files. Borders, names and water cut from the OpenFreeMap planet (OpenMapTiles schema). Data © OpenStreetMap contributors, available under the Open Database License (ODbL); schema © OpenMapTiles."
          fi
          cp measure.txt "measure-borders-$VERSION.txt"
          gh release upload "$release" --repo "$GITHUB_REPOSITORY" --clobber \
            globecraft-*-"$VERSION"*.pmtiles "measure-borders-$VERSION.txt"
          gh release download "$release" --repo "$GITHUB_REPOSITORY" --pattern manifest.json \
            --output old-manifest.json 2> /dev/null || echo '{}' > old-manifest.json
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$release"
          python3 - "$base" <<'PY'
          import json, os, sys
          base, version = sys.argv[1], os.environ["VERSION"]
          manifest = json.load(open("old-manifest.json"))
          previous = manifest.get("borders", {}).get("version")
          manifest["borders"] = {
              "version": version,
              "previous": previous if previous != version else manifest.get("borders", {}).get("previous"),
              "sets": [[f"{base}/{part}" for part in parts] for parts in json.load(open("parts.json"))],
          }
          json.dump(manifest, open("manifest.json", "w"), indent=1)
          PY
          cat manifest.json
          gh release upload "$release" --repo "$GITHUB_REPOSITORY" --clobber manifest.json
          # Keep this build's files and the previous build's; delete the rest.
          keep_previous=$(python3 -c 'import json; print(json.load(open("manifest.json"))["borders"]["previous"] or "")')
          stale=$(gh release view "$release" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            grep -E '^(globecraft-(borders|water)-|measure-borders-)' |
            grep -v -F -e "$VERSION" ${keep_previous:+-e "$keep_previous"} || true)
          for old in $stale; do
            echo "Deleting $old"
            gh release delete-asset "$release" "$old" --repo "$GITHUB_REPOSITORY" --yes
          done
