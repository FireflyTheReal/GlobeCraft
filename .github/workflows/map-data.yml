name: Map data

# Builds the vector tile sets GlobeCraft streams, cut from OpenFreeMap's weekly planet
# (Planetiler, OpenMapTiles schema) as PMTiles a client reads tile by tile. A full
# OpenFreeMap tile carries every layer (100-500 KB); each set keeps only what one
# GlobeCraft layer draws:
#   borders    `boundary` and `place`, plus the ocean of `water` (a second set), z0-12
#   transport  railways, trams and subways, ferries (`transportation`, with their
#              names) and airports (`aeroway`, `aerodrome_label`), z0-14
#   roads      roads (`transportation` motorway to service and roadworks, with
#              `transportation_name` for their names), z0-12; roads13 and roads14
#              are the same for zoom 13 and zoom 14 alone (each a run of its own)
#   poi        points of interest (`poi`), peaks (`mountain_peak`), rivers and
#              canals (`waterway`), water names (`water_name`) and parks (`park`),
#              z0-14
# Manual only. Publishing replaces that set's files in the one `map-data`
# pre-release (the app's updater ignores pre-releases); its manifest.json names the
# current files of every set. Data: (c) OpenStreetMap contributors (ODbL),
# (c) OpenMapTiles.
on:
  workflow_dispatch:
    inputs:
      set:
        description: 'Which tile set to build'
        type: choice
        options: [borders, transport, roads, roads13, roads14, poi]
        default: borders
      version:
        description: 'OpenFreeMap planet version, e.g. 20261025_080012_pt (empty: the newest)'
        required: false
        default: ''
      publish:
        description: 'Publish the files into the map-data release'
        type: boolean
        default: false

permissions:
  contents: write

# One run per set at a time; different sets build side by side (the publish step
# merges each set into the shared manifest and checks it stayed there).
concurrency:
  group: map-data-${{ inputs.set }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TIPPECANOE_REF: '2.79.0'
      PMTILES_VERSION: '1.31.2'
    steps:
      # The planet file is bigger than either disk alone: join the root disk's free
      # space and the temporary disk into one volume.
      - name: Remove preinstalled tools this job does not use
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift \
            /usr/local/lib/node_modules /usr/local/share/chromium /opt/microsoft /opt/google \
            /usr/local/julia* /opt/az /usr/share/miniconda /usr/local/aws-cli || true
          df -h /

      - name: Make room
        uses: easimon/maximize-build-space@v10
        with:
          build-mount-path: /work
          root-reserve-mb: 3072
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Pick the planet version
        id: pick
        run: |
          sudo chown "$USER" /work
          df -h / /work
          curl -fsS https://btrfs.openfreemap.com/files.txt -o /work/files.txt
          grep 'areas/planet/' /work/files.txt | tail -n 12
          version='${{ inputs.version }}'
          if [ -z "$version" ]; then
            version=$(grep -oE 'areas/planet/[0-9]{8}_[0-9]{6}_pt/tiles\.mbtiles' /work/files.txt \
              | sort | tail -n 1 | cut -d/ -f3)
          fi
          test -n "$version"
          url="https://btrfs.openfreemap.com/areas/planet/$version/tiles.mbtiles"
          size=$(curl -fsSI "$url" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          free=$(df --output=avail -B1 /work | tail -n 1)
          echo "::notice::Planet $version: $((size / 1024 / 1024 / 1024)) GiB; free on /work: $((free / 1024 / 1024 / 1024)) GiB"
          if [ "$size" -gt "$((free - 3 * 1024 * 1024 * 1024))" ]; then
            echo "::error::The planet file does not fit on /work"
            exit 1
          fi

      - name: Choose the set
        id: set
        run: |
          case '${{ inputs.set }}' in
            borders) zooms="0 12"; names="borders water" ;;
            transport) zooms="0 14"; names="transport" ;;
            roads) zooms="0 12"; names="roads" ;;
            roads13) zooms="13 13"; names="roads13" ;;
            roads14) zooms="14 14"; names="roads14" ;;
            poi) zooms="0 14"; names="poi" ;;
            *) echo "::error::unknown set"; exit 1 ;;
          esac
          read -r minzoom maxzoom <<< "$zooms"
          echo "minzoom=$minzoom" >> "$GITHUB_OUTPUT"
          echo "maxzoom=$maxzoom" >> "$GITHUB_OUTPUT"
          echo "names=$names" >> "$GITHUB_OUTPUT"

      - name: Build tippecanoe and fetch pmtiles
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev aria2 sqlite3 > /dev/null
          git clone -q --depth 1 --branch "$TIPPECANOE_REF" https://github.com/felt/tippecanoe /work/tippecanoe
          make -s -C /work/tippecanoe -j"$(nproc)" tile-join
          curl -fsSL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /work pmtiles

      - name: Download the planet
        run: |
          aria2c -q -x 8 -s 8 -k 64M --file-allocation=none -d /work -o planet.mbtiles '${{ steps.pick.outputs.url }}'
          ls -l /work/planet.mbtiles
          df -h /work

      # How big each OpenMapTiles layer is, by zoom, from a sample of planet tiles:
      # the numbers that decide which further sets are worth building.
      - name: Sample the planet's layer sizes
        working-directory: /work
        shell: python3 {0}
        run: |
          import gzip, random, sqlite3
          def varint(data, at):
              value = shift = 0
              while True:
                  byte = data[at]; at += 1
                  value |= (byte & 0x7F) << shift; shift += 7
                  if byte < 0x80:
                      return value, at
          def layers(tile):
              at, out = 0, {}
              while at < len(tile):
                  key, at = varint(tile, at)
                  kind = key & 7
                  if kind == 2:
                      length, at = varint(tile, at)
                      if key >> 3 == 3:
                          body = tile[at:at + length]
                          name_key, inner = varint(body, 0)
                          name_length, inner = varint(body, inner)
                          name = body[inner:inner + name_length].decode()
                          out[name] = out.get(name, 0) + length
                      at += length
                  elif kind == 0:
                      _, at = varint(tile, at)
                  elif kind == 5:
                      at += 4
                  else:
                      at += 8
              return out
          random.seed(1)
          db = sqlite3.connect("planet.mbtiles")
          lines = ["Share of each layer (uncompressed bytes) and estimated gzip MiB per zoom, from 400 random tiles per zoom:"]
          for z in range(15):
              n = 1 << z
              totals, gzip_total, raw_total, samples = {}, 0, 0, 0
              for _ in range(400):
                  x, y = random.randrange(n), random.randrange(n)
                  row = db.execute("SELECT tile_data FROM tiles WHERE zoom_level=? AND tile_column=? AND tile_row=?", (z, x, y)).fetchone()
                  if not row:
                      continue
                  data = row[0]
                  raw = gzip.decompress(data) if data[:2] == b"\x1f\x8b" else data
                  gzip_total += len(data); raw_total += len(raw); samples += 1
                  for name, size in layers(raw).items():
                      totals[name] = totals.get(name, 0) + size
              if not samples:
                  continue
              estimate = gzip_total / samples * n * n / 1048576
              shares = ", ".join(f"{name} {100 * size / raw_total:.0f}%" for name, size in sorted(totals.items(), key=lambda item: -item[1]))
              lines.append(f"z{z}: ~{estimate:,.0f} MiB: {shares}")
          print("\n".join(lines))
          print("::notice::" + "%0A".join(lines))

      # Zooms above the set's maximum are most of the planet: let tile-join see only
      # the zooms the set keeps, by narrowing the planet's own `tiles` view in place
      # (copying the rest out needed more room than the volume has left).
      - name: Show only the set's zooms
        if: steps.set.outputs.maxzoom != '14' || steps.set.outputs.minzoom != '0'
        working-directory: /work
        env:
          MINZOOM: ${{ steps.set.outputs.minzoom }}
          MAXZOOM: ${{ steps.set.outputs.maxzoom }}
        shell: python3 {0}
        run: |
          import os
          MINZOOM, MAXZOOM = int(os.environ["MINZOOM"]), int(os.environ["MAXZOOM"])
          import re, sqlite3, sys, traceback
          def report(kind, exc_type, exc, tb):
              message = " | ".join(traceback.format_exception(exc_type, exc, tb)).replace("\n", " ")
              print(f"::error::{message[-900:]}")
          sys.excepthook = lambda *e: report("error", *e)
          db = sqlite3.connect("planet.mbtiles")
          kind, sql = db.execute("SELECT type, sql FROM sqlite_master WHERE name = 'tiles'").fetchone()
          print(f"::notice::Planet tiles {kind}: {' '.join(sql.split())[:300]}")
          if kind == "view":
              # The definition's own header, whatever whitespace follows its AS.
              body = re.match(r"(?is)\s*create\s+view\s+\S+\s+as\s+(.*)", sql).group(1)
              db.execute("DROP VIEW tiles")
              db.execute(f"CREATE VIEW tiles AS SELECT * FROM ({body}) WHERE zoom_level BETWEEN {MINZOOM} AND {MAXZOOM}")
          else:
              db.execute("ALTER TABLE tiles RENAME TO tiles_all")
              db.execute(f"CREATE VIEW tiles AS SELECT * FROM tiles_all WHERE zoom_level BETWEEN {MINZOOM} AND {MAXZOOM}")
          db.commit()
          count = db.execute("SELECT count(*) FROM tiles WHERE zoom_level = ?", (MINZOOM,)).fetchone()[0]
          print(f"::notice::Zoom {MINZOOM} tiles through the narrowed view: {count}")

      - name: Keep the set's layers
        working-directory: /work
        # Temporary files (SQLite's index sort, tile-join, the converter) are as large
        # as the data: keep them off the small root disk.
        env:
          TMPDIR: /work/tmp
          SQLITE_TMPDIR: /work/tmp
        run: |
          mkdir -p "$TMPDIR"
          attribution='<a href="https://openmaptiles.org/">&copy; OpenMapTiles</a> <a href="https://www.openstreetmap.org/copyright">&copy; OpenStreetMap contributors</a>'
          case '${{ inputs.set }}' in
            borders)
              ./tippecanoe/tile-join --force --no-tile-size-limit --maximum-zoom=12 \
                --layer=boundary --layer=place -A "$attribution" \
                -n "GlobeCraft borders and names" -o borders.mbtiles planet.mbtiles
              ./tippecanoe/tile-join --force --no-tile-size-limit --maximum-zoom=12 \
                --layer=water --feature-filter='{"water":["==","class","ocean"]}' -A "$attribution" \
                -n "GlobeCraft ocean" -o water.mbtiles planet.mbtiles
              ;;
            transport)
              # Rail (incl. narrow gauge, preserved, funicular), transit (subway, light
              # rail, monorail, tram) and ferries with their names; every airport
              # feature (runways, taxiways, aprons, areas) and airport label.
              ./tippecanoe/tile-join --force --no-tile-size-limit --maximum-zoom=14 \
                --layer=transportation --layer=transportation_name --layer=aeroway --layer=aerodrome_label \
                --feature-filter='{"transportation":["in","class","rail","transit","ferry"],"transportation_name":["in","class","rail","transit","ferry"]}' \
                -A "$attribution" -n "GlobeCraft railways, ferries and airports" \
                -o transport.mbtiles planet.mbtiles
              ;;
            roads|roads13|roads14)
              # Roads from motorways to service roads and their roadworks (rail,
              # ferries and paths are elsewhere or left out), and the named lines
              # for their names.
              classes='"motorway","trunk","primary","secondary","tertiary","minor","service","busway","raceway"'
              classes="$classes"',"motorway_construction","trunk_construction","primary_construction","secondary_construction","tertiary_construction","minor_construction","service_construction"'
              ./tippecanoe/tile-join --force --no-tile-size-limit --maximum-zoom=14 \
                --layer=transportation --layer=transportation_name \
                --feature-filter="{\"transportation\":[\"in\",\"class\",$classes],\"transportation_name\":[\"in\",\"class\",$classes]}" \
                -A "$attribution" -n "GlobeCraft roads" \
                -o "${{ inputs.set }}.mbtiles" planet.mbtiles
              ;;
            poi)
              # Points of interest, peaks, rivers and canals (not streams and
              # ditches), names of seas, lakes and bays, and parks.
              ./tippecanoe/tile-join --force --no-tile-size-limit --maximum-zoom=14 \
                --layer=poi --layer=mountain_peak --layer=waterway --layer=water_name --layer=park \
                --feature-filter='{"waterway":["in","class","river","canal"]}' \
                -A "$attribution" -n "GlobeCraft places of interest" \
                -o poi.mbtiles planet.mbtiles
              ;;
          esac
          rm planet.mbtiles

      - name: Measure
        working-directory: /work
        run: |
          for set in ${{ steps.set.outputs.names }}; do
            echo "## $set"
            sqlite3 -header -column "$set.mbtiles" \
              "SELECT zoom_level AS z, count(*) AS tiles, round(sum(length(tile_data))/1048576.0, 1) AS MiB,
                      round(avg(length(tile_data))/1024.0, 2) AS avg_KiB, max(length(tile_data))/1024 AS max_KiB
               FROM tiles GROUP BY zoom_level ORDER BY zoom_level;"
          done | tee measure.txt
          ls -l *.mbtiles | tee -a measure.txt
          {
            echo '```'
            cat measure.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for set in ${{ steps.set.outputs.names }}; do
            echo "::notice::$set by zoom (z tiles MiB): $(sqlite3 "$set.mbtiles" "SELECT group_concat(zoom_level || ' ' || n || ' ' || mib, ', ') FROM (SELECT zoom_level, count(*) AS n, round(sum(length(tile_data))/1048576.0) AS mib FROM tiles GROUP BY zoom_level ORDER BY zoom_level)")"
            echo "::notice::$set: $(sqlite3 "$set.mbtiles" "SELECT count(*) || ' tiles, ' || round(sum(length(tile_data))/1048576.0) || ' MiB, z${{ steps.set.outputs.maxzoom }} avg ' || round(avg(CASE WHEN zoom_level = ${{ steps.set.outputs.maxzoom }} THEN length(tile_data) END)/1024.0, 2) || ' KiB' FROM tiles")"
          done

      - name: Convert to PMTiles
        working-directory: /work
        # Temporary files (SQLite's index sort, tile-join, the converter) are as large
        # as the data: keep them off the small root disk.
        env:
          TMPDIR: /work/tmp
          SQLITE_TMPDIR: /work/tmp
        run: |
          mkdir -p "$TMPDIR"
          for set in ${{ steps.set.outputs.names }}; do
            ./pmtiles convert "$set.mbtiles" "globecraft-$set-${{ steps.pick.outputs.version }}.pmtiles"
          done
          ls -l *.pmtiles | tee -a measure.txt
          for file in *.pmtiles; do
            echo "::notice::$file: $(( $(stat -c %s "$file") / 1048576 )) MiB"
          done

      - name: Split under GitHub's asset limit
        working-directory: /work
        env:
          VERSION: ${{ steps.pick.outputs.version }}
          NAMES: ${{ steps.set.outputs.names }}
          MINZOOM: ${{ steps.set.outputs.minzoom }}
          MAXZOOM: ${{ steps.set.outputs.maxzoom }}
          TMPDIR: /work/tmp
        # Release assets must stay under 2 GiB: an archive over the limit is cut into
        # parts, first by peeling off its top zoom, then into longitude halves. The app
        # tries a set's parts in order and skips those whose bounds miss a tile.
        shell: python3 {0}
        run: |
          import json, os, subprocess
          LIMIT = 1_900_000_000
          SOUTH, NORTH = -85.0511287798, 85.0511287798
          version = os.environ["VERSION"]
          sets = []
          for name in os.environ["NAMES"].split():
              whole = f"globecraft-{name}-{version}.pmtiles"
              queue, parts = [(int(os.environ["MINZOOM"]), int(os.environ["MAXZOOM"]), -180.0, 180.0, whole)], []
              while queue:
                  low, high, west, east, path = queue.pop(0)
                  if os.path.getsize(path) < LIMIT:
                      parts.append(path)
                      continue
                  if low < high:
                      pieces = [(low, high - 1, west, east), (high, high, west, east)]
                  elif east - west > 1.0:
                      middle = (west + east) / 2
                      pieces = [(low, high, west, middle), (low, high, middle, east)]
                  else:
                      raise SystemExit(f"::error::{path} cannot be split further")
                  for low_z, high_z, w, e in pieces:
                      out = f"part-{name}-z{low_z}-{high_z}-{w:+.1f}-{e:+.1f}.pmtiles"
                      subprocess.run(["./pmtiles", "extract", whole, out,
                                      f"--minzoom={low_z}", f"--maxzoom={high_z}",
                                      f"--bbox={w},{SOUTH},{e},{NORTH}"], check=True)
                      queue.append((low_z, high_z, w, e, out))
                  if path != whole:
                      os.remove(path)
              # Final names: one part keeps the plain name, several are numbered.
              if parts != [whole]:
                  named = []
                  for index, path in enumerate(parts):
                      final = f"globecraft-{name}-{version}-{index}.pmtiles"
                      os.rename(path, final)
                      named.append(final)
                  os.remove(whole)
                  parts = named
              for path in parts:
                  print(f"::notice::{path}: {os.path.getsize(path) // 1048576} MiB")
              sets.append(parts)
          with open("parts.json", "w") as out:
              json.dump(sets, out)
          print(json.dumps(sets))

      - name: Publish into the map data release
        if: inputs.publish
        working-directory: /work
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
          KEY: ${{ inputs.set }}
          NAMES: ${{ steps.set.outputs.names }}
        # All map data lives in ONE pre-release, `map-data` (the app's updater
        # ignores pre-releases): its `manifest.json` names the current files of each
        # set. A new build uploads its files under new names, then switches its entry
        # in the manifest, then deletes that set's files of older builds except the
        # one before (a running app may still read it until it reloads the manifest).
        run: |
          set -euo pipefail
          files=()
          for name in $NAMES; do
            for file in globecraft-"$name"-"$VERSION"*.pmtiles; do
              size=$(stat -c %s "$file")
              if [ "$size" -ge 2147483648 ]; then
                echo "::error::$file is $size bytes, over GitHub's 2 GiB asset limit"
                exit 1
              fi
              files+=("$file")
            done
          done
          release=map-data
          if ! gh release view "$release" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$release" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Map data" \
              --notes "Map data GlobeCraft streams: manifest.json names the current files of each set. Cut from the OpenFreeMap planet (OpenMapTiles schema). Data © OpenStreetMap contributors, available under the Open Database License (ODbL); schema © OpenMapTiles."
          fi
          cp measure.txt "measure-$KEY-$VERSION.txt"
          gh release upload "$release" --repo "$GITHUB_REPOSITORY" --clobber \
            "${files[@]}" "measure-$KEY-$VERSION.txt"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$release"
          cat > merge.py <<'PY'
          import json, os, sys
          base, version, key = sys.argv[1], os.environ["VERSION"], os.environ["KEY"]
          manifest = json.load(open("old-manifest.json"))
          old = manifest.get(key, {})
          manifest[key] = {
              "version": version,
              "previous": old.get("version") if old.get("version") != version else old.get("previous"),
              "sets": [[f"{base}/{part}" for part in parts] for parts in json.load(open("parts.json"))],
          }
          json.dump(manifest, open("manifest.json", "w"), indent=1)
          PY
          # Other sets may publish at the same time: merge into the newest manifest,
          # then check this set's entry survived, else merge again.
          for attempt in 1 2 3 4 5; do
            rm -f old-manifest.json
            gh release download "$release" --repo "$GITHUB_REPOSITORY" --pattern manifest.json \
              --output old-manifest.json 2> /dev/null || echo '{}' > old-manifest.json
            python3 merge.py "$base"
            gh release upload "$release" --repo "$GITHUB_REPOSITORY" --clobber manifest.json
            sleep $((RANDOM % 20 + 10))
            rm -f check.json
            gh release download "$release" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --output check.json
            if python3 -c 'import json, os, sys; m = json.load(open("check.json")); sys.exit(m.get(os.environ["KEY"], {}).get("sets") != json.load(open("manifest.json"))[os.environ["KEY"]]["sets"])'; then
              break
            fi
            echo "The manifest changed underneath; merging again ($attempt)"
          done
          cat check.json
          # Keep this build's files and the previous build's; delete the set's others.
          keep_previous=$(python3 -c 'import json, os; print(json.load(open("manifest.json"))[os.environ["KEY"]]["previous"] or "")')
          prefixes=$(echo $NAMES | tr ' ' '|')
          stale=$(gh release view "$release" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            grep -E "^(globecraft-($prefixes)-|measure-$KEY-)" |
            grep -v -F -e "$VERSION" ${keep_previous:+-e "$keep_previous"} || true)
          for old in $stale; do
            echo "Deleting $old"
            gh release delete-asset "$release" "$old" --repo "$GITHUB_REPOSITORY" --yes
          done
