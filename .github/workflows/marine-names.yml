name: Marine names

# Publishes the names of the oceans, seas, EEZs and undersea features into the one
# `map-data` pre-release as `globecraft-marine-names-<date>.geojson.gz` and the manifest
# entry `marine_names`. Sources: the Marine Regions gazetteer (Flanders Marine
# Institute, marineregions.org, CC BY 4.0) for oceans, seas, sea areas and EEZs, in
# English where it has an English name; the IHO-IOC GEBCO Gazetteer of Undersea
# Feature Names (as NOAA NCEI serves it) for the undersea features. One point per
# place with `name`, `kind` (ocean, sea, eez, undersea), the gazetteer `type`,
# `size_km` (how far across it is) and `source`, largest first.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the file into the map-data release'
        type: boolean
        default: true
  schedule:
    # Twice a year: the gazetteer changes slowly.
    - cron: '23 4 2 1,7 *'

permissions:
  contents: write

concurrency:
  group: map-data-marine-names
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Read the gazetteer
        id: source
        run: |
          set -euo pipefail
          version=$(date -u +%Y%m%d)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat > names.py <<'PY'
          """Marine names, one point per place, as GeoJSON: oceans, seas and sea areas and EEZs
          from the Marine Regions gazetteer (Flanders Marine Institute, CC BY 4.0), in English
          where the gazetteer has an English name; undersea features from the IHO-IOC GEBCO
          Gazetteer of Undersea Feature Names (as served by NOAA NCEI)."""
          import gzip, json, math, re, sys, time, urllib.parse, urllib.request
          
          MR = "https://www.marineregions.org/rest/"
          GEBCO = ("https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/"
                   "Undersea_Features/FeatureServer/{}/query")
          KINDS = {
              "ocean": ["Ocean"],
              "sea": ["Sea", "IHO Sea Area", "General Sea Area", "Gulf", "Strait", "Channel",
                      "Sound", "Bight", "Bay", "Passage"],
              "eez": ["EEZ"],
          }
          # A point feature's size when the gazetteer gives none (a seamount, a hole…).
          POINT_SIZE_KM = 15.0
          MAX_PAGES = int(sys.argv[2]) if len(sys.argv) > 2 else 10_000
          
          def fetch(url, required=True):
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(url, timeout=90) as response:
                          body = response.read()
                          return json.loads(body) if body.strip() else []
                  except urllib.error.HTTPError as error:
                      if error.code in (404, 204):
                          return []
                      time.sleep(2 + attempt * 4)
                  except Exception:
                      time.sleep(2 + attempt * 4)
              if not required:
                  print(f"skipped: {url}")
                  return []
              raise SystemExit(f"failed: {url}")
          
          def span_km(lat, west, south, east, north):
              """How far across a box is (sides in either order; the shorter way round in
              longitude, so a box across the date line is not taken for the whole world)."""
              dlat = abs(north - south) * 111.2
              dlon = abs(east - west) % 360
              dlon = min(dlon, 360 - dlon) * 111.2 * math.cos(math.radians(lat))
              return max(dlat, dlon)
          
          def full_name(name, place_type):
              """GEBCO keeps the generic term apart (`Mariana`, `Trench`): put it back."""
              generic = place_type.strip()
              if not generic or generic.upper() == "UNKNOWN" or generic.lower() in name.lower():
                  return name
              return f"{name} {generic}"
          
          def english(record):
              """The English name: the preferred one when it is English, else the first
              Latin-script name the gazetteer lists for the place (its English name first)."""
              name = record.get("preferredGazetteerName") or ""
              if record.get("preferredGazetteerNameLang") == "English":
                  return name
              # Optional: without its other names a place keeps its preferred one.
              names = fetch(MR + f"getGazetteerNamesByMRGID.json/{record['MRGID']}/", required=False)
              time.sleep(0.1)
              latin = [c for c in (names if isinstance(names, list) else [])
                       if c and re.fullmatch(r"[\x20-\x7e]+", c)]
              # An English name says what the place is ("East China Sea", not "Tung Hai").
              generic = re.compile(r"\b(Ocean|Sea|Gulf|Bay|Strait|Channel|Sound|Bight|Passage|Zone)\b")
              for candidate in latin:
                  if generic.search(candidate):
                      return candidate
              return latin[0] if latin else name
          
          features, seen, counts = [], set(), {}
          def add(name, kind, place_type, lon, lat, size_km, source):
              features.append({
                  "type": "Feature",
                  "geometry": {"type": "Point", "coordinates": [round(lon, 4), round(lat, 4)]},
                  "properties": {"name": name, "kind": kind, "type": place_type,
                                 "size_km": round(size_km, 1), "source": source},
              })
              counts[place_type] = counts.get(place_type, 0) + 1
          
          for kind, types in KINDS.items():
              for place_type in types:
                  offset, pages = 0, 0
                  while pages < MAX_PAGES:
                      batch = fetch(MR + "getGazetteerRecordsByType.json/"
                                    f"{urllib.parse.quote(place_type)}/?offset={offset}")
                      if not batch:
                          break
                      for r in batch:
                          if r.get("latitude") is None or r.get("longitude") is None:
                              continue
                          if r.get("accepted") not in (None, r["MRGID"]) or r.get("status") not in ("standard", None):
                              continue
                          if r["MRGID"] in seen:
                              continue
                          seen.add(r["MRGID"])
                          name = english(r).strip()
                          if not name:
                              continue
                          size = 2 * (r.get("precision") or 0) / 1000
                          if None not in (r.get("minLatitude"), r.get("maxLatitude"), r.get("minLongitude"), r.get("maxLongitude")):
                              size = max(size, span_km(r["latitude"], r["minLongitude"], r["minLatitude"], r["maxLongitude"], r["maxLatitude"]))
                          place_kind = "ocean" if name.endswith(" Ocean") else kind
                          add(name, place_kind, place_type, r["longitude"], r["latitude"], size, "marineregions")
                      offset += len(batch)
                      pages += 1
                      time.sleep(0.2)
          
          # GEBCO's undersea feature names: points, lines (ridges, trenches…) and areas.
          for layer in (0, 1, 2):
              offset = 0
              while True:
                  query = urllib.parse.urlencode({
                      "where": "1=1", "outFields": "NAME,TYPE", "returnGeometry": "true",
                      "outSR": 4326, "maxAllowableOffset": 0.05, "resultOffset": offset,
                      "resultRecordCount": 1000, "f": "json",
                  })
                  page = fetch(GEBCO.format(layer) + "?" + query)
                  rows = page.get("features", []) if isinstance(page, dict) else []
                  for row in rows:
                      name = (row["attributes"].get("NAME") or "").strip()
                      geometry = row.get("geometry") or {}
                      if not name:
                          continue
                      name = full_name(name, row["attributes"].get("TYPE") or "")
                      if "x" in geometry:
                          add(name, "undersea", row["attributes"].get("TYPE") or "", geometry["x"], geometry["y"], POINT_SIZE_KM, "gebco")
                          continue
                      parts = geometry.get("paths") or geometry.get("rings") or []
                      points = [p for part in parts for p in part]
                      if not points:
                          continue
                      lons = [p[0] for p in points]; lats = [p[1] for p in points]
                      if max(lons) - min(lons) > 180:  # across the date line: count from 0° to 360°
                          lons = [lon % 360 for lon in lons]
                      west, east, south, north = min(lons), max(lons), min(lats), max(lats)
                      if layer == 1:
                          # A line's middle vertex lies on it; its box's centre may not.
                          longest = max(parts, key=len)
                          lon, lat = longest[len(longest) // 2]
                      else:
                          lon, lat = (west + east) / 2, (south + north) / 2
                      lon = (lon + 180) % 360 - 180
                      add(name, "undersea", row["attributes"].get("TYPE") or "", lon, lat,
                          max(POINT_SIZE_KM, span_km(lat, west, south, east, north)), "gebco")
                  if not page.get("exceededTransferLimit") or not rows:
                      break
                  offset += len(rows)
                  time.sleep(0.2)
          
          for place_type, n in sorted(counts.items()):
              print(f"{place_type}: {n}")
          print("total", len(features))
          features.sort(key=lambda f: -f["properties"]["size_km"])
          data = json.dumps({"type": "FeatureCollection", "features": features}, separators=(",", ":"), ensure_ascii=False)
          with gzip.open(sys.argv[1], "wt", encoding="utf-8") as out:
              out.write(data)
          PY
          python3 names.py "globecraft-marine-names-$version.geojson.gz"
          ls -la *.gz

      - name: Check the names
        run: |
          set -euo pipefail
          python3 - globecraft-marine-names-*.geojson.gz <<'PY'
          import gzip, json, sys
          data = json.load(gzip.open(sys.argv[1], "rt", encoding="utf-8"))
          names = {f["properties"]["name"] for f in data["features"]}
          kinds = {f["properties"]["kind"] for f in data["features"]}
          print(len(data["features"]), "names;", sorted(kinds))
          for expected in ["Pacific Ocean", "Atlantic Ocean", "Mariana Trench", "Mid-Atlantic Ridge", "Strait of Gibraltar"]:
              assert expected in names, expected
          # English names, not the gazetteer's first listed language ("Tung Hai").
          assert any(name.startswith("East") and name.endswith("China Sea") for name in names)
          assert kinds == {"ocean", "sea", "eez", "undersea"}, kinds
          assert len(data["features"]) > 7000, len(data["features"])
          # No place wider than the Pacific (a box read across the date line would be).
          assert max(f["properties"]["size_km"] for f in data["features"]) < 25000
          PY

      - name: Publish into the map data release
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
          KEY: marine_names
        # Same rules as the other sets (map-data.yml, airports.yml, timezones.yml).
        run: |
          set -euo pipefail
          release=map-data
          file="globecraft-marine-names-$VERSION.geojson.gz"
          gh release upload "$release" --repo "$GITHUB_REPOSITORY" --clobber "$file"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$release"
          cat > merge.py <<'PY'
          import json, os, sys
          base, version, key = sys.argv[1], os.environ["VERSION"], os.environ["KEY"]
          manifest = json.load(open("old-manifest.json"))
          old = manifest.get(key, {})
          manifest[key] = {
              "version": version,
              "previous": old.get("version") if old.get("version") != version else old.get("previous"),
              "file": f"{base}/globecraft-marine-names-{version}.geojson.gz",
              "licence": "Marine Regions gazetteer, Flanders Marine Institute (CC BY 4.0); IHO-IOC GEBCO Gazetteer of Undersea Feature Names",
          }
          json.dump(manifest, open("manifest.json", "w"), indent=1)
          PY
          for attempt in 1 2 3 4 5; do
            rm -f old-manifest.json check.json
            gh release download "$release" --repo "$GITHUB_REPOSITORY" --pattern manifest.json \
              --output old-manifest.json 2> /dev/null || echo '{}' > old-manifest.json
            python3 merge.py "$base"
            gh release upload "$release" --repo "$GITHUB_REPOSITORY" --clobber manifest.json
            sleep $((RANDOM % 20 + 10))
            gh release download "$release" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --output check.json
            if python3 -c 'import json, os, sys; sys.exit(json.load(open("check.json")).get(os.environ["KEY"], {}).get("file") != json.load(open("manifest.json"))[os.environ["KEY"]]["file"])'; then
              break
            fi
            echo "The manifest changed underneath; merging again ($attempt)"
          done
          previous=$(python3 -c 'import json, os; print(json.load(open("old-manifest.json")).get(os.environ["KEY"], {}).get("version") or "")')
          stale=$(gh release view "$release" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            grep -E '^globecraft-marine-names-.*\.geojson\.gz$' |
            grep -v -x -e "$file" -e "globecraft-marine-names-$previous.geojson.gz" || true)
          for old in $stale; do
            gh release delete-asset "$release" "$old" --repo "$GITHUB_REPOSITORY" --yes
          done
