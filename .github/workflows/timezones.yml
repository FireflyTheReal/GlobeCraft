name: Time zones

# Publishes the world's time zones, simplified for the globe, into the one
# `map-data` pre-release as `globecraft-timezones-<release>.geojson.gz` and the
# manifest entry `timezones`. Source: timezone-boundary-builder on GitHub (every
# zone, with the ocean zones so every point has one; not the `-now` file, which
# merges zones whose clocks agree today and so gets past dates wrong), built from
# OpenStreetMap, ODbL. Features by `kind`: `zone` (a (multi)polygon with its IANA
# name in `tzid`, for the zone under the cursor, at sea too), `line` (where the
# standard time changes, as on a classic time zone map: the ocean's 15° zones
# between their meridians, and land zones where their standard time differs from
# their neighbour's, sea zones included; summer time is left out, as on such maps)
# and `label` (one point in each sizeable area whose standard time is not a whole
# hour, e.g. `+5:30`; the app labels the whole hours itself, along the view, north
# of 58° S). South of 60° S the source's rectangle per research station is replaced
# by the standard map of Antarctica's time (Wikimedia Commons "UTC hue4map ATA"): the
# continent and its ice shelves (Natural Earth, from its GitHub repository) with the
# Peninsula and the Ross Dependency as sectors to the South Pole, the other coasts in
# sectors on their stations' time down to 80° S, the interior on UTC and the pole on
# New Zealand's time, with a label each; the sea around stays in the ocean's 15° zones.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the file into the map-data release'
        type: boolean
        default: true
  schedule:
    # The 1st of each month: the boundaries change a few times a year.
    - cron: '41 5 1 * *'

permissions:
  contents: write

concurrency:
  group: map-data-timezones
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download the newest boundaries
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=evansiroky/timezone-boundary-builder
          tag=$(gh release view --repo "$repo" --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --repo "$repo" --pattern 'timezones-with-oceans.geojson.zip'
          unzip -o timezones-with-oceans.geojson.zip
          ls -la

      - name: Group the zones by their clocks
        run: |
          set -euo pipefail
          source=$(ls combined*.json | head -1)
          pip install --break-system-packages --quiet shapely==2.0.6
          ne=https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson
          curl -fsSL -o land.geojson "$ne/ne_50m_land.geojson"
          curl -fsSL -o ice-shelves.geojson "$ne/ne_50m_antarctic_ice_shelves_polys.geojson"
          # Each zone's standard time: the smaller of its UTC offsets in mid-January
          # and mid-July of this year (summer time only ever adds).
          python3 - "$source" land.geojson ice-shelves.geojson <<'PY'
          import datetime, json, sys, zoneinfo
          from shapely.geometry import box, mapping, shape
          from shapely.ops import unary_union

          data = json.load(open(sys.argv[1]))
          year = datetime.date.today().year
          def offset(tz, month):
              at = datetime.datetime(year, month, 15, 12, tzinfo=datetime.timezone.utc)
              return int(at.astimezone(zoneinfo.ZoneInfo(tz)).utcoffset().total_seconds() // 60)
          def text(minutes):
              sign = "+" if minutes >= 0 else "−"
              minutes = abs(minutes)
              return f"{sign}{minutes // 60}" + (f":{minutes % 60:02d}" if minutes % 60 else "")
          def keyed(tz, geometry):
              standard = min(offset(tz, 1), offset(tz, 7))
              return {"type": "Feature",
                      "properties": {"tzid": tz, "key": standard, "whole": standard % 60 == 0,
                                     "label": text(standard)},
                      "geometry": mapping(geometry) if not isinstance(geometry, dict) else geometry}

          # South of 60° S (the Antarctic Treaty's limit) the source has a rectangle per
          # research station. It is replaced by the standard map of Antarctica's time
          # (Wikimedia Commons, "UTC hue4map ATA", 2011): on the continent and its ice
          # shelves, the Peninsula and the Ross Dependency are sectors reaching the South
          # Pole, the rest of the coast is in sectors on its stations' time down to 80° S,
          # and the interior beyond is on UTC, but for the South Pole station on New
          # Zealand's time. Each sector takes its stations' current time (Mawson has kept +5
          # since 2009, which the 2011 map still shows as +6). The sea around is in the
          # ocean's 15° zones.
          LIMIT = -60.0
          INTERIOR = -80.0
          POLE = -88.8  # Amundsen-Scott South Pole Station's circle
          QUEEN_MAUD_EAST = 44.0 + 38 / 60
          ADELIE_WEST = 136.0 + 11 / 60
          REGIONS = [  # west, east, south, north (degrees), zone, label (lon, lat) or None
              (-180.0, 180.0, -90.0, POLE, "Antarctica/McMurdo", None),
              (160.0, 180.0, -90.0, LIMIT, "Antarctica/McMurdo", (-175.0, -82.0)),  # Ross Dependency
              (-180.0, -150.0, -90.0, LIMIT, "Antarctica/McMurdo", None),
              (-90.0, -20.0, -90.0, LIMIT, "Antarctica/Rothera", (-62.0, -76.0)),  # the Peninsula
              (-20.0, 15.0, INTERIOR, LIMIT, "Antarctica/Troll", (-2.5, -74.0)),
              (15.0, QUEEN_MAUD_EAST, INTERIOR, LIMIT, "Antarctica/Syowa", (35.0, -72.0)),
              (QUEEN_MAUD_EAST, 70.0, INTERIOR, LIMIT, "Antarctica/Mawson", (57.0, -73.0)),
              (70.0, 98.5, INTERIOR, LIMIT, "Antarctica/Davis", (84.0, -73.0)),
              (98.5, ADELIE_WEST, INTERIOR, LIMIT, "Antarctica/Casey", (117.0, -73.0)),
              (ADELIE_WEST, 160.0, INTERIOR, LIMIT, "Antarctica/DumontDUrville", (152.0, -70.5)),
              (-150.0, -90.0, INTERIOR, LIMIT, "Etc/GMT+6", (-105.0, -76.0)),  # Marie Byrd Land
              (-180.0, 180.0, -90.0, INTERIOR, "Etc/UTC", (90.0, -85.0)),  # the interior
          ]
          # Islands and ice rises smaller than this (square degrees) stay with the sea, and
          # holes in the ice are filled: their coasts would only scatter short lines.
          MIN_LAND_DEG2 = 0.5

          def solid(geometry):
              from shapely.geometry import MultiPolygon, Polygon
              parts = geometry.geoms if hasattr(geometry, "geoms") else [geometry]
              kept = [Polygon(p.exterior) for p in parts
                      if isinstance(p, Polygon) and p.area >= MIN_LAND_DEG2]
              return unary_union(kept)

          land = solid(unary_union([
              shape(f["geometry"]).intersection(box(-180, -90, 180, LIMIT))
              for name in sys.argv[2:]
              for f in json.load(open(name))["features"]
              if shape(f["geometry"]).bounds[1] < LIMIT
          ]).buffer(0))
          south = box(-180, -90, 180, LIMIT)
          features = []
          for feature in data["features"]:
              tz = feature["properties"]["tzid"]
              geometry = shape(feature["geometry"])
              if geometry.bounds[1] < LIMIT:
                  geometry = geometry.difference(south)
                  if geometry.is_empty:
                      continue
                  features.append(keyed(tz, geometry))
              else:
                  features.append(keyed(tz, feature["geometry"]))
          taken = None
          for west, east, low, high, tz, _ in REGIONS:
              area = land.intersection(box(west, low, east, high))
              if taken is not None:
                  area = area.difference(taken)
              if area.is_empty:
                  continue
              taken = area if taken is None else unary_union([taken, area])
              features.append(keyed(tz, area))
          sea = south.difference(land)
          for hour in range(-12, 13):
              west, east = max(hour * 15 - 7.5, -180), min(hour * 15 + 7.5, 180)
              part = sea.intersection(box(west, -90, east, LIMIT))
              if not part.is_empty:
                  # Etc/GMT has the sign the other way round.
                  tz = "Etc/GMT" if hour == 0 else f"Etc/GMT{'-' if hour > 0 else '+'}{abs(hour)}"
                  features.append(keyed(tz, part))
          data["features"] = features
          json.dump(data, open("keyed.json", "w"))
          # A label in each region, as on the map.
          labels = []
          for _, _, _, _, tz, at in REGIONS:
              if at is None:
                  continue
              standard = min(offset(tz, 1), offset(tz, 7))
              labels.append({"type": "Feature", "properties": {"label": text(standard)},
                             "geometry": {"type": "Point", "coordinates": list(at)}})
          json.dump({"type": "FeatureCollection", "features": labels}, open("antarctic-labels.json", "w"))
          print(len(features), "zones,", len({f["properties"]["key"] for f in features}), "standard times")
          PY

      - name: Simplify, draw the lines between clocks and place their labels
        run: |
          set -euo pipefail
          # A distance tolerance (no point moves more than 500 m) keeps every corner;
          # a share of the points would cut them, and the ocean zones' long meridian
          # sides would cross the globe. Zones on the same standard time merge, sea
          # and land alike, so only the borders where the time changes remain. Areas
          # off the whole hour larger than 10,000 km² get a label, largest first.
          NODE_OPTIONS=--max-old-space-size=6144 npx --yes mapshaper@0.6.102 -i keyed.json name=all \
            -simplify dp interval=500 keep-shapes \
            -filter-fields tzid,key,whole,label \
            -o zones.json target=all format=geojson precision=0.001 \
            -dissolve key copy-fields=whole,label target=all + name=regions \
            -innerlines target=regions + name=lines \
            -o lines.json target=lines format=geojson precision=0.001 \
            -filter '!whole' target=regions + name=parts \
            -explode target=parts \
            -filter 'this.area > 1e10' target=parts \
            -sort 'this.area' descending target=parts \
            -points inner target=parts + name=labels \
            -o labels.json target=labels format=geojson precision=0.01
          python3 - <<'PY'
          import json, sys
          zones = json.load(open("zones.json"))["features"]
          lines = json.load(open("lines.json"))
          lines = lines.get("geometries") or [f["geometry"] for f in lines.get("features", [])]
          # Antarctica's sector labels first: they keep their places.
          labels = (json.load(open("antarctic-labels.json"))["features"]
                    + json.load(open("labels.json"))["features"])
          names = {f["properties"]["tzid"] for f in zones}
          print(f"{len(zones)} zones, {len(lines)} border lines, {len(labels)} labels")
          for needed in ("Europe/Berlin", "America/New_York", "Asia/Kolkata", "Etc/GMT-12"):
              if needed not in names:
                  sys.exit(f"missing {needed}")
          # Antarctica's sectors run to the South Pole station's circle (88.8° S).
          if not any(lat < -88.5 for g in lines for part in
                     (g["coordinates"] if g["type"] == "MultiLineString" else [g["coordinates"]])
                     for _, lat in part):
              sys.exit("no line reaches the South Pole: Antarctic sectors missing?")
          # The ocean's zones are there: a line runs down the mid-Atlantic at 22.5° W.
          def near(lon, lat, g):
              parts = g["coordinates"] if g["type"] == "MultiLineString" else [g["coordinates"]]
              return any(abs(a[0] - lon) < 0.01 and abs(b[0] - lon) < 0.01
                         and min(a[1], b[1]) <= lat <= max(a[1], b[1])
                         for part in parts for a, b in zip(part, part[1:]))
          if not any(near(-22.5, 0.0, g) for g in lines):
              sys.exit("no ocean meridian at 22.5 W: ocean zones missing?")
          if len(names) < 300 or len(lines) < 20 or len(labels) < 5:
              sys.exit("too few zones, lines or labels: the source changed?")
          features = [
              {"type": "Feature", "properties": {"kind": "zone", "tzid": f["properties"]["tzid"]},
               "geometry": f["geometry"]} for f in zones
          ] + [
              {"type": "Feature", "properties": {"kind": "line"}, "geometry": g} for g in lines
          ] + [
              {"type": "Feature", "properties": {"kind": "label", "label": f["properties"]["label"]},
               "geometry": f["geometry"]} for f in labels
          ]
          json.dump({"type": "FeatureCollection", "features": features},
                    open("timezones.geojson", "w"), separators=(",", ":"))
          PY
          ls -la timezones.geojson
          gzip -9 -c timezones.geojson > "globecraft-timezones-${{ steps.source.outputs.tag }}.geojson.gz"
          ls -la globecraft-timezones-*.geojson.gz

      - name: Publish into the map data release
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.tag }}
          KEY: timezones
        # Same rules as the other sets (map-data.yml, airports.yml).
        run: |
          set -euo pipefail
          release=map-data
          file="globecraft-timezones-$VERSION.geojson.gz"
          gh release upload "$release" --repo "$GITHUB_REPOSITORY" --clobber "$file"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$release"
          cat > merge.py <<'PY'
          import json, os, sys
          base, version, key = sys.argv[1], os.environ["VERSION"], os.environ["KEY"]
          manifest = json.load(open("old-manifest.json"))
          old = manifest.get(key, {})
          manifest[key] = {
              "version": version,
              "previous": old.get("version") if old.get("version") != version else old.get("previous"),
              "file": f"{base}/globecraft-timezones-{version}.geojson.gz",
              "licence": "timezone-boundary-builder, from OpenStreetMap (ODbL)",
          }
          json.dump(manifest, open("manifest.json", "w"), indent=1)
          PY
          for attempt in 1 2 3 4 5; do
            rm -f old-manifest.json check.json
            gh release download "$release" --repo "$GITHUB_REPOSITORY" --pattern manifest.json \
              --output old-manifest.json 2> /dev/null || echo '{}' > old-manifest.json
            python3 merge.py "$base"
            gh release upload "$release" --repo "$GITHUB_REPOSITORY" --clobber manifest.json
            sleep $((RANDOM % 20 + 10))
            gh release download "$release" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --output check.json
            if python3 -c 'import json, os, sys; sys.exit(json.load(open("check.json")).get(os.environ["KEY"], {}).get("file") != json.load(open("manifest.json"))[os.environ["KEY"]]["file"])'; then
              break
            fi
            echo "The manifest changed underneath; merging again ($attempt)"
          done
          previous=$(python3 -c 'import json, os; print(json.load(open("old-manifest.json")).get(os.environ["KEY"], {}).get("version") or "")')
          stale=$(gh release view "$release" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            grep -E '^globecraft-timezones-.*\.geojson\.gz$' |
            grep -v -x -e "$file" -e "globecraft-timezones-$previous.geojson.gz" || true)
          for old in $stale; do
            gh release delete-asset "$release" "$old" --repo "$GITHUB_REPOSITORY" --yes
          done
