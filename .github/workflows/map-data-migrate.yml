name: Map data migration (one-off)

# Moves the border files into the single `map-data` pre-release and removes the two
# `tiles-borders*` pre-releases. Deleted again after it has run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OLD: tiles-borders-20261025_080012_pt
      VERSION: 20261025_080012_pt
    steps:
      - name: Rename the border release to map-data
        run: |
          set -euo pipefail
          id=$(gh api "repos/$REPO/releases/tags/$OLD" --jq .id)
          gh api -X PATCH "repos/$REPO/releases/$id" -f tag_name=map-data -f name="Map data" \
            -F prerelease=true -f make_latest=false \
            -f body="Map data GlobeCraft streams: manifest.json names the current files. Borders, names and water cut from the OpenFreeMap planet (OpenMapTiles schema). Data © OpenStreetMap contributors, available under the Open Database License (ODbL); schema © OpenMapTiles." \
            --jq .tag_name
          # The measurement file gets the name new builds use.
          asset=$(gh api "repos/$REPO/releases/$id/assets" --jq '.[] | select(.name == "measure.txt") | .id')
          if [ -n "$asset" ]; then
            gh api -X PATCH "repos/$REPO/releases/assets/$asset" -f name="measure-borders-$VERSION.txt" --jq .name
          fi
      - name: Write the manifest
        run: |
          set -euo pipefail
          base="https://github.com/$REPO/releases/download/map-data"
          python3 - "$base" <<'PY'
          import json, os, sys
          base, version = sys.argv[1], os.environ["VERSION"]
          borders = [f"{base}/globecraft-borders-{version}-{i}.pmtiles" for i in range(4)]
          water = [f"{base}/globecraft-water-{version}.pmtiles"]
          manifest = {"borders": {"version": version, "previous": None, "sets": [borders, water]}}
          json.dump(manifest, open("manifest.json", "w"), indent=1)
          PY
          cat manifest.json
          gh release upload map-data --repo "$REPO" --clobber manifest.json
          # Every named file must answer.
          python3 -c 'import json; m = json.load(open("manifest.json")); print("\n".join(u for s in m["borders"]["sets"] for u in s))' |
            while read -r url; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-126 "$url")
              echo "$code $url"
              [ "$code" = 206 ]
            done
      - name: Remove the old releases and tags
        run: |
          set -euo pipefail
          gh release delete tiles-borders --repo "$REPO" --cleanup-tag --yes || true
          gh api -X DELETE "repos/$REPO/git/refs/tags/$OLD" || true
          gh api "repos/$REPO/releases" --jq '.[] | "\(.tag_name) prerelease=\(.prerelease) assets=\(.assets | length)"'
