[workspace]
members = [
    "apps/globecraft",
    "crates/globecraft-core",
    "crates/globecraft-data",
    "crates/globecraft-render",
    "crates/globecraft-assistant",
]
default-members = ["apps/globecraft"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
globecraft-core = { path = "crates/globecraft-core" }
globecraft-data = { path = "crates/globecraft-data" }
globecraft-render = { path = "crates/globecraft-render", default-features = false }
globecraft-assistant = { path = "crates/globecraft-assistant" }
eframe = "0.36.2"
# Native desktop menu adapters; keep GUI/platform dependencies out of the libraries.
muda = { version = "0.21.2", default-features = false }
rfd = { version = "0.17.2", default-features = false }
raw-window-handle = "0.6.2"
emath = "0.36.2"
egui-wgpu = "0.36.2"
egui_kittest = { version = "0.36.2", features = ["wgpu", "eframe", "snapshot"] }
sys-locale = "0.3.2"
self_update = { version = "1.3.0", default-features = false, features = ["github", "reqwest", "rustls", "async", "checksums", "archive-zip", "compression-zip-deflate", "archive-tar", "compression-tar-gz"] }
semver = "1.0"
mgrs-convert = "0.1.0"
sofars = "0.6.1"
png = "0.18.1"
ab_glyph = "0.2.32"
gilrs = "0.11.2"
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "fontconfig"] }
geographiclib-rs = { version = "0.2.7", default-features = false }
glam = { version = "0.34.1", default-features = false, features = ["std", "f64"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
wgpu = "30.0.1"
pollster = "1.0.1"
wide = "1.7.1"
moka = { version = "0.12.16", default-features = false, features = ["sync"] }
thiserror = "2.0.21"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"
unicode-normalization = "0.1.25"
quick-xml = "0.42.0"
kml = { version = "0.14.0", default-features = false }
# Reads KMZ imports (bounded) and writes KMZ exports; kml decodes the extracted text.
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
rayon = "1.12.0"
rstar = "0.13.0"
geo-index = "0.4.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "sync", "fs", "io-util", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio-rusqlite = "0.8.0"
fst = "0.4.7"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 2

# Thin LTO keeps local release builds quick; the release workflow switches to fat
# LTO with one codegen unit for published binaries. Panics keep unwinding, since the
# assistant and background tasks catch them.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
